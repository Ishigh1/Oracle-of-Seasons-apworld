3f/5d56/: db $5e ; SND_GETSEED

16//handleUnlockTreasure: |
  ld a,c
  add a,a
  add a,a
  add a,c
  ld hl,unlockFlags
  rst 10  ; addAToHL
  push hl
  
  ldi a,(hl)
  ld d,$c9 ; <wGroup4RoomFlags
  cp $04
  jr z,@setFlag
  inc d ; <wGroup5RoomFlags
  
  @setFlag:
  ; First flag
  ldi a,(hl)
  ld e,a
  ld a,(de)
  or (hl)
  inc hl
  ld (de),a
  
  ; Second flag
  ldi a,(hl)
  ld e,a
  ld a,(de)
  or (hl)
  inc hl
  ld (de),a
  
  ; Now try to make an effect if it is the active room
  pop hl
  ld a,($cc49) ; active group
  cp (hl)
  inc hl
  ret nz
  ; Room 1
  ld a,($cc4c) ; active room
  cp (hl)
  jr z,@unlockInRoom
  ; Room 2
  inc hl
  inc hl
  cp (hl)
  ret nz
  @unlockInRoom:
  inc hl
  ld a,(hl)
  ld hl,flagToTileTable
  ld e,$01
  call searchKey
  ld a,(hl)
  push af
  call $15ba ; findTileInRoom
  ret nz
  
  ; createKeySpriteInteraction
  push hl
  push af
  call getFreeInteractionSlot
  ld (hl),$17 ; INTERAC_DUNGEON_KEY_SPRITE
  inc l
  
  ; Store tile index in subid
  pop af
  ld (hl),a
  ld l,$4b ; Interaction.yh
  pop bc ; get the position as c
  call $2077 ; setShortPosition_paramC
  ; Key interaction has been set
  
  pop af
  cp $80
  jr z,@keyBlock
  
  push af
  call getFreeInteractionSlot
  ld (hl),$1e ; INTERAC_DOOR_CONTROLLER
  ld l,$4b ; Interaction.yh
  ld a,c
  ld (hl),a
  ld l,$49 ; Interaction.angle
  pop af
  sub $70
  add a,a
  ld (hl),a
  ret
  
  @keyBlock:
  ld a,$a0 ; TILEINDEX_STANDARD_FLOOR
  call setTile
  
  ld a,$6c ; SND_OPENCHEST
  call playSound
  
  call getFreeInteractionSlot
  ld (hl),$05 ; INTERAC_PUFF
  ld l,$4b ; Interaction.yh
  call $2077 ; setShortPosition_paramC
  ret

16//unlockFlags: /include unlockFlagsData

16//flagToTileTable: |
  db $01, $70
  db $02, $71
  db $04, $72
  db $08, $73
  db $80, $1e

